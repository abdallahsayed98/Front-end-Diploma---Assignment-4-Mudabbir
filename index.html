<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@100;200;300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/media.css">
    <title>مدبّر | إدارة أموالك بذكاء</title>
</head>

<body>
    <aside></aside>
    <main class="d-flex flex-column gap-6">
        <header class="d-flex flex-column border rounded-lg gap-4 p-2 box-shadow">
            <div class="d-flex align-items-center gap-3">
                <div class="flex-icon main-icon rounded-lg">
                    <img class="img" src="images/icons/coins-solid-full.png" alt="coins icon">
                </div>
                <div class="title d-flex flex-column gap-1">
                    <h1>مدبّر</h1>
                    <p>إدارة أموالك بذكاء</p>
                </div>
            </div>
            <div class="user d-flex justify-content-between align-items-center">
                <div class="icons d-flex gap-1">
                    <i class="flex-icon border rounded-md fa-sm fa-solid fa-magnifying-glass"></i>
                    <i class="flex-icon border rounded-md fa-sm fa-regular fa-bell"></i>
                </div>
                <div class="d-flex justify-content-between align-items-center profile-pic bg-white border rounded-md box-shadow">
                    <img class="rounded-md" src="images/avatar-1.jpg" alt="profile picture">
                </div>
            </div>
            <div class="status d-flex align-items-center justify-content-center border rounded-sm">
                <span>متصل</span>
            </div>
        </header>
        <div class="summary-cards grid gap-6">
            <div class="card d-flex flex-column gap-2 bg-white border rounded-lg box-shadow p-4">
                <p class="info">الرصيد الحالي</p>
                <p class="money">8,450 جنية</p>
                <div class="status d-flex align-items-center gap-1">
                    <i class="fa-solid fa-arrow-up"></i>
                    <span>+2.5%</span>
                </div>
            </div>
            <div class="card d-flex flex-column gap-2 bg-white border rounded-lg box-shadow p-4">
                <p class="info">الدخل</p>
                <p class="money">15,000 جنية</p>
                <div class="status d-flex align-items-center gap-1">
                    <i class="fa-solid fa-arrow-up"></i>
                    <span>+8.2%</span>
                </div>
            </div>
            <div class="card d-flex flex-column gap-2 bg-white border rounded-lg box-shadow p-4">
                <p class="info">المصروفات</p>
                <p class="money">10,000 جنية</p>
                <div class="status d-flex align-items-center gap-1">
                    <i class="fa-solid fa-arrow-down"></i>
                    <span>-1.2%</span>
                </div>
            </div>
        </div>
    </main>
</body>

</html>
